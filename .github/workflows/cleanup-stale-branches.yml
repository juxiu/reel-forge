name: one-time-cleanup-stale-branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stale-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[cleanup-branches]')
    runs-on: ubuntu-latest
    steps:
      - name: Delete audited non-main branches and remove this workflow
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              "ci/archive-production-artifacts",
              "ci/default-checkpoints",
              "feat/director-preflight-system",
              "feat/production-gate-and-text-provenance",
              "feat/video-shotcraft-integration",
              "feat/visual-benchmark-skill",
              "fix/audit-content-duration-gates",
              "fix/audit-p0-theme-fingerprint",
              "fix/audit-production-safety",
            ];
            const failures = [];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: "heads/" + branch,
                });
                core.info("Deleted branch: " + branch);
              } catch (error) {
                if (error.status === 404) {
                  core.info("Branch already absent: " + branch);
                } else {
                  core.error("Could not delete " + branch + ": " + error.message);
                  failures.push(branch + ": " + error.message);
                }
              }
            }
            if (failures.length) {
              core.setFailed("Some branch deletions failed: " + failures.join("; "));
              throw new Error("Branch cleanup incomplete; keep this workflow for diagnosis/retry.");
            }
            const workflowPath = ".github/workflows/cleanup-stale-branches.yml";
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: workflowPath,
              ref: "main",
            });
            if (Array.isArray(current.data) || !current.data.sha) {
              throw new Error("Cannot identify temporary cleanup workflow blob for self-removal.");
            }
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: workflowPath,
              message: "chore: remove temporary branch cleanup workflow [cleanup-branches-complete]",
              sha: current.data.sha,
              branch: "main",
            });
            core.info("Temporary cleanup workflow removed from main.");
