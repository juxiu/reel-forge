name: verify
on:
  push:
    branches: ["main"]
  pull_request:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  functional-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: npm install
      - run: npm run verify:plan
      - run: npm run verify:contracts
      - run: npm run verify:runtime
      - run: npm run verify:approval
      - run: npm run verify:build
      - run: npm run verify:scheduler
      - run: npm run verify:store
      - run: npm run verify:research
      - run: npm run verify:visual
      - run: npm run verify:repair
      - run: npm run verify:hyperframes
      - run: npm run run-production
      - run: npm run tts
      - run: npm run storyboard
      - run: npm run selfcheck
      - run: npm run materialize-ir
      - run: npm run build-groups
      - run: npm run materialize-shots
      - run: npm run verify:shots
      - run: npm run verify:e2e
      - run: npm run preview
      - run: npm run pilot
      - run: node scripts/checkpoint.mjs pilot-preview approved
      - run: npm run render
      - run: npm run frame-metrics -- --frames artifacts/frames/16x9 --out artifacts/digest-explainer/qc/frame_metrics_16x9.json
      - run: npm run frame-metrics -- --frames artifacts/frames/9x16 --out artifacts/digest-explainer/qc/frame_metrics_9x16.json
      - run: npm run motion-check artifacts/frames/16x9 --report artifacts/digest-explainer/qc/motion_16x9.json
      - run: npm run motion-check artifacts/frames/9x16 --report artifacts/digest-explainer/qc/motion_9x16.json
      - run: npm run qc || (npm run repair && AUTO_APPROVE=1 npm run render && npm run qc)
      - run: npm run verify:qc
      - run: npm run deliver
      - run: npm run verify:delivery
