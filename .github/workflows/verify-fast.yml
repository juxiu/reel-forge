name: verify-fast

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "scripts/**"
      - "fixtures/**"
      - "contracts/**"
      - "package.json"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "fixtures/**"
      - "contracts/**"
      - "package.json"
      - "requirements.txt"
      - ".github/workflows/**"

concurrency:
  group: verify-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify:fast
