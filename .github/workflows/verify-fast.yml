name: verify-fast

on:
  push:
    branches: ["main"]
    paths:
      - "SKILL.md"
      - "src/**"
      - "scripts/**"
      - "fixtures/**"
      - "contracts/**"
      - "package.json"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "SKILL.md"
      - "src/**"
      - "scripts/**"
      - "fixtures/**"
      - "contracts/**"
      - "package.json"
      - "requirements.txt"
      - ".github/workflows/**"

concurrency:
  group: verify-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run verify:fast
      # verify:authored-shots 已在 scripts/verify-fast.mjs 的检查清单里（`:47`），这里不再单跑一遍。
      # 它此前必须单列，是因为当时 fast 清单里没有它，PR 之外没人判 authored 合规。
